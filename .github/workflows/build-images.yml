name: build-images

# Builds the two control-plane images on GitHub-hosted runners and pushes them
# to GHCR, so the Docker host never has to run `next build` itself. The host
# pulls prebuilt images via infra/compose.prod.yml.
#
# The host also needs the Cloudflare DNS token, which Actions never sees: it is
# only in the host's .env (or Infisical at runtime). Nothing secret is read here.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".brainstorm/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Overridden per-job to the image name.
  OWNER: d0nj

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image:
              name: convex-control-plane-web
            context: .
            dockerfile: apps/web/Dockerfile
          - image:
              name: convex-control-plane-worker
            context: .
            dockerfile: apps/worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # Runners ship with ~14GB free; a Next build + two images can spike.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: false
