# Convex control plane — single Docker host (homelab).
#
# Env rule: dev via 'infisical run -- docker compose -f infra/compose.yml up' OR prod via '--env-file .env'. No baked secrets.
#
# Usage (from the repo root):
#   docker compose -f infra/compose.yml config
#   docker compose -f infra/compose.yml up -d control-postgres convex-data-postgres
#   pnpm db:migrate
#   docker compose -f infra/compose.yml up -d
#
# Every `${VAR}` below is a plain environment placeholder with no baked-in
# value. Supply the values either way:
#   dev  — infisical run -- docker compose -f infra/compose.yml up -d
#   prod — cp .env.example .env  (fill it in) then
#          docker compose --env-file .env -f infra/compose.yml up -d
# Compose resolves the project directory from the first `-f` file, so a plain
# `docker compose -f infra/compose.yml up` reads `.env` next to THIS file.
#
# ../.env.example documents the key NAMES only (never values). Unset keys
# resolve to empty and fail loudly at `up` time — Postgres refuses to start
# without a password — rather than falling back to something insecure.

name: convex-control-plane

services:
  # Reverse proxy. Reads container labels over the Docker socket (:ro) and
  # never reloads — per-project routers are declared as labels by the worker.
  traefik:
    image: traefik:latest
    restart: unless-stopped
    environment:
      # Static config is infra/traefik/traefik.yml (mounted below); the ACME
      # contact address and the DNS provider credential are injected via the
      # environment because Traefik does not interpolate variables inside
      # traefik.yml itself.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: admin@${BASE_DOMAIN}
      # Lego credential for the DNS-01 challenge (provider: cloudflare).
      # Plain env placeholder: supplied by `infisical run` in dev, or by
      # `--env-file .env` in prod. Never a literal value.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only observes containers, it never mutates them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Persist ACME state so certificates survive recreates.
      - traefik-acme:/acme
    networks:
      - proxy
    # No traefik.* labels: the provider is opt-in (exposedByDefault: false),
    # so the proxy is never routed through itself.

  # Control database: better-auth tables + projects/secrets/events + pg-boss.
  # Reachable only on the internal backend network, never published.
  control-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CONTROL_PG_PASSWORD}
    volumes:
      - control-pg:/var/lib/postgresql/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One Postgres instance holding one database per Convex project
  # (dbname = slug with '-' -> '_'). Also internal-only.
  convex-data-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: ${CONVEX_PG_PASSWORD}
    volumes:
      - convex-pg:/var/lib/postgresql/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convex -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Next.js UI + better-auth. Enqueues pg-boss jobs only.
  # NEVER mounts the Docker socket — it must not be able to touch Docker.
  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${CONTROL_PG_PASSWORD}@control-postgres:5432/control
      # pg-boss lives in the control database (design §1).
      BOSS_DB: postgres://postgres:${CONTROL_PG_PASSWORD}@control-postgres:5432/control
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Public origin better-auth issues OAuth callbacks / CSRF checks against
      # (required in deploy; see .env.example). Derived per-request if unset.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SECRETS_KEY: ${SECRETS_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN}
      # Consumed by better-auth socialProviders (Task 3); blank disables them.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    networks:
      - proxy
      - backend-internal
    depends_on:
      control-postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # web is on two networks; pin which one Traefik uses to reach it.
      - traefik.docker.network=proxy
      - traefik.http.routers.control-web.rule=Host(`${BASE_DOMAIN}`)
      - traefik.http.routers.control-web.entrypoints=websecure
      - traefik.http.routers.control-web.tls=true
      - traefik.http.routers.control-web.tls.certresolver=letsencrypt
      # Request one wildcard certificate for the whole domain here; every
      # per-project router then reuses it (design §1, "wildcard TLS").
      - traefik.http.routers.control-web.tls.domains[0].main=${BASE_DOMAIN}
      - traefik.http.routers.control-web.tls.domains[0].sans=*.${BASE_DOMAIN}
      # Must match the port apps/web listens on (Task 6).
      - traefik.http.services.control-web.loadbalancer.server.port=3000

  # pg-boss workers + Docker provisioning. The ONLY service with a
  # read-write Docker socket — it creates/removes per-project containers.
  worker:
    build:
      context: ../apps/worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${CONTROL_PG_PASSWORD}@control-postgres:5432/control
      # Admin connection to convex-data Postgres (used to CREATE/DROP DATABASE).
      CONVEX_PG_ADMIN_URL: postgres://convex:${CONVEX_PG_PASSWORD}@convex-data-postgres:5432/postgres
      # Connection string WITHOUT a database name — passed to backend
      # containers as POSTGRES_URL (design §1).
      CONVEX_PG_URL_BASE: postgres://convex:${CONVEX_PG_PASSWORD}@convex-data-postgres:5432
      SECRETS_KEY: ${SECRETS_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN}
      CONVEX_BACKEND_IMAGE: ${CONVEX_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend:latest}
    volumes:
      # READ-WRITE, full mount: this is the single privileged mount in the
      # stack. No other service may mount the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
      - backend-internal
    depends_on:
      control-postgres:
        condition: service_healthy
      convex-data-postgres:
        condition: service_healthy

volumes:
  control-pg:
  convex-pg:
  traefik-acme:

networks:
  # Shared network that per-project Convex backend containers join (created by
  # the worker with NetworkMode "proxy"). Pinned to an exact name so that the
  # orchestrator's hard-coded network name resolves.
  proxy:
    name: proxy
  # Postgres traffic only; `internal: true` blocks outside access.
  backend-internal:
    name: backend-internal
    internal: true
